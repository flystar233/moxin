; 墨水屏监控器与阅读器 · 主程序（PCB1，ESP32-S3-WROOM-1-N16R8）
; 编译：pio run        烧录：pio run -t upload        串口：pio device monitor
; 烧录时按住电源键 SW3（或 R33 点锡），否则复位那一下 PWR_HOLD 掉了就断电。
; 板子开着时也可以不按键、走串口升级：pio run -e pcb1_serial -t upload（见文末）

[platformio]
default_envs = pcb1

[env:pcb1]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    unit-electronics-mx/DevLab_LibHelix@^0.9.4
; 界面字体（霞鹜新晰黑 26 / 20，GB2312 子集）和桌面的数字字库（Barlow Condensed，只收数字），大屏用，直接放在 flash 里。
; 来源、生成命令、许可见 data/FONTS.md
board_build.embed_files =
    data/ui_small.efnt
    data/ui_big.efnt
    data/ui_han_20.efnt
    data/ui_han_26.efnt
    data/desk_clock.efnt
    data/desk_num54.efnt
    data/desk_num34.efnt
    data/desk_num24.efnt
    data/desk_note.efnt
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; 串口升级：板子开着、跑着 app 固件时用，不用按电源键（拆了 R33 以后普通烧录要一直按住电源键）。
; pio run -e pcb1_serial -t upload
[env:pcb1_serial]
extends = env:pcb1
upload_protocol = custom
upload_command = "$PYTHONEXE" tools/fwupdate.py --port $UPLOAD_PORT $SOURCE
